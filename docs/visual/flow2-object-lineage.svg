<text class="t" x="56" y="1169">FROZEN Run</text>
<text class="s m" x="56" y="1186">validation 7 项检查全 PASS</text>
<text class="s " x="56" y="1203">冻结 = 从原始字节把整条链重算一遍，</text>
<text class="s " x="56" y="1220">不是打标记。离线重放 155–170 秒／Run。</text>
<text class="f " x="392" y="1166">重建表格网格 · 重跑 validate_reader_output · 重跑 check_evidence</text>
<text class="f " x="392" y="1183">全部要求<tspan class='add'>逐字段相等</tspan>，并要求 execution_semantics_hash 没变</text>
<text class="f " x="392" y="1200">所以落盘的 PASS 不能自证，必须能被重新算出来</text>
