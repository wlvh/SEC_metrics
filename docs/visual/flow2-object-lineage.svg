<text class="r" x="894" y="1187">「冻结」不等于「永远可重放」：可重放性是</text>
<text class="r" x="894" y="1203">相对于当前 Requirement 快照而言的</text>
<rect class="good" x="40" y="1268" width="1160" height="128" rx="4"/>
<text class="t" x="60" y="1294">链路到此为止 —— 下游可以相信什么，以及这条链<tspan class="m">没有</tspan>说什么</text>
<text class="g" x="60" y="1318">可以相信：模型指的每一格都真的存在且逐字节吻合 · 口径都能追到表里的具体标签 · 值是 Evidence 自己算的 · 批准绑定了复核者实际看到的字节</text>
<text class="g" x="60" y="1337">可以相信：出网前一定留下 marker，「可能已经花了钱」永远可知 · 失败保留完整请求与响应字节 · 冻结 Run 可以离线全量重演</text>
<text class="r" x="60" y="1361">没有说：模型能读任意酒店集团的 KPI 表。全部 15 次真实调用中 7 次通过，<tspan class="m">全部是 Marriott</tspan>；跨发行人 7 次尝试 0 次成功。</text>
<text class="r" x="60" y="1380">没有说：AI 结果已经在用。到当前快照为止，进入 active publication 的 AI 结果数量是 <tspan class="m">0</tspan>，三个 provider 计数器全为 0。</text>
