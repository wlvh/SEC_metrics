name: vNext fast suite

"on":
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: vNext fast suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Verify company import transactions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest -v tests.vnext.test_company_handoff tests.vnext.test_company_source_authority tests.vnext.test_company_results tests.vnext.test_company_processing tests.vnext.test_company_event_census tests.vnext.test_company_local

      - name: Historical statement scope, inventory and shared dispatch (small state)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts:tools
        run: python3 -m unittest -v tests.vnext.test_historical_statement_cases.HistoricalStatementScopeTest tests.vnext.test_historical_filing_inventory_small.ABlockIsHeldToThePriorYearWalksChecks tests.vnext.test_history_company_dispatch.HistoryCompanyDispatchTest

      - name: Selected filing income source checks (small state)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts:tools
        run: python3 -m unittest -v tests.vnext.test_selected_income_source_v1

      - name: Run fast suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/run_foundation_ci.py --suite fast --jobs 4

      - name: Verify H1 short business boundaries
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts:tools
        run: python3 -m unittest -v tests.vnext.test_legal_review_contract
      - name: Verify H2 short business boundaries
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts:tools
        run: python3 -m unittest -v tests.vnext.test_history_business_boundaries.BankScopeBusinessTest tests.vnext.test_history_business_boundaries.ParamountWindowBusinessTest tests.vnext.test_history_business_boundaries.FiscalDurationCalculationTest

  inherited-source-material:
    name: Foundation inherited source material
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Run inherited material selectors with existing limits
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/run_foundation_ci.py --suite source-material --jobs 2

  main-foundation:
    name: Main foundation audit and historical compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fixed candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch the declared historical baseline only
        # Historical readers need this fixed tree, not every branch/tag/ancestor.
        # Full objects are fetched here, before tests; no lazy network reads.
        run: |
          old_commit=$(python3 -c 'import json; print(json.load(open("requirements/issue_28_v1/baseline_manifest.json"))["repository"]["commit"])')
          git fetch --no-tags --depth=1 origin "$old_commit"
          git cat-file -e "$old_commit^{commit}"
          git show "$old_commit:outputs/active_publication.json" > /tmp/historical-active-publication.json
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Validate main audit and fixed historical objects
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts:tools
        run: |
          python3 -m unittest -v tests.test_foundation_ci tests.vnext.test_main_scalability_audit tests.vnext.test_issue28_requirement_transition
          python3 tools/check_main_scalability.py --output /tmp/main-scalability-audit.csv
          python3 tools/check_provider_egress.py
          python3 tools/generate_metrics_reference.py --check

  # #54 source/business obligations remain; current saved-source closeout does not
  # recreate old native installs, ancestor byte proofs or unfrozen model families.
  # Old creation tests stay in their saved runtime; disposition and limits:
  # docs/evidence/issue28_company_records_20261007/diagnose-retained-ci-01efa3d/conclusion.md
  company-source-core:
    name: Company source authority, ledger and D04 wiring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Install pinned offline request tokenizer
        run: python3 -m pip install --no-deps --require-hashes -r requirements-continuous-context.txt
      - name: Source admission, sessions, storage identity, call ledger/policy and discovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts
        run: python3 tests/required_unittests.py tests.vnext.test_saved_source_checks tests.vnext.test_ordinary_storage_identity tests.vnext.test_continuous_call_ledger tests.vnext.test_continuous_call_policy.ContinuousCallPolicyTest.test_real_record_loads_but_limits_model_retry_and_money_cannot_be_changed tests.vnext.test_continuous_call_policy.ContinuousCallPolicyTest.test_production_permission_or_edited_comment_is_not_this_approval tests.vnext.test_continuous_call_policy.ContinuousCallPolicyTest.test_missing_or_invalid_usage_is_not_zero_and_actual_cost_is_unavailable tests.vnext.test_normal_source_requirements tests.vnext.test_prior_html_dependency tests.vnext.test_d04_native_assessment tests.vnext.test_native_request_variants
      - name: Registered native routing and absence controls (small state)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts
        run: python3 tests/required_unittests.py tests.vnext.test_registered_native_update.RegisteredNativeUpdateTest

  company-c04-source-install:
    name: Company C04 source and subject checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Install pinned offline request tokenizer
        run: python3 -m pip install --no-deps --require-hashes -r requirements-continuous-context.txt
      - name: Saved C04 sources, same-subject comparison and event completeness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts
        # The current saved-source candidate does not install legacy proof trees.
        # Keep source/form/CIK/prior/event requirements; retained installs use saved runtime.
        run: python3 tests/required_unittests.py tests.vnext.test_governance_signals.AuditorSignalsTest tests.vnext.test_c04_registration_successor tests.vnext.test_normal_governance_input

  company-update-history:
    name: Company update history and interruption recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Install pinned offline request tokenizer
        run: python3 -m pip install --no-deps --require-hashes -r requirements-continuous-context.txt
      - name: Real update history, source changes and interruption recovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts
        # Current records cover completed success/withheld, source/config changes,
        # pointer recovery and isolation. Legacy native test stays in its saved runtime.
        run: python3 tests/required_unittests.py tests.vnext.test_ordinary_current_update tests.vnext.test_company_current_records.SavedSourceCompanyEntryTest

  company-partial-update:
    name: Company independent metric updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Install pinned offline request tokenizer
        run: python3 -m pip install --no-deps --require-hashes -r requirements-continuous-context.txt
      - name: Independent results and historical periods through actual mixed outcomes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts
        # Preserve the business obligation with actual non-calendar originals,
        # not by changing the old PARTIAL/INCOMPLETE expected string.
        run: python3 tests/required_unittests.py tests.vnext.test_company_current_records.MixedSavedBusinessOutcomeTest tests.vnext.test_company_current_records.CurrentCompanyTest
