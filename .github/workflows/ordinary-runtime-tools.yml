name: Ordinary runtime tools
on:
  pull_request:
permissions:
  contents: read
jobs:
  ordinary-runtime:
    name: Ordinary saved result and runtime tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'
      - name: Small business tests and one saved-source integration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts
        run: python3 -m unittest tests.vnext.test_runtime_tools tests.vnext.test_ordinary_saved_result tests.vnext.test_company_results tests.vnext.test_company_local
