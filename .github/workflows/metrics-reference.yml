name: Metrics reference tables

# Runs on every pull request without a path filter: the reference tables
# depend on 40 declared inputs across catalog/, config/, scripts/ and the
# definition document, and an unfiltered run is the simplest proof that a
# change to any of them either keeps the committed tables reproducible or is
# reported as SOURCE_DRIFT.  This workflow adds to the existing vNext fast
# suite; it does not replace or filter it.
"on":
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    name: Generate check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Verify committed reference tables match declared inputs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/generate_metrics_reference.py --check

      - name: Run reference table tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest tests.test_metrics_reference -v
